name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch makes the running build obsolete.
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  PAPER_VERSION: '26.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is a binary in the repository; verify it is an official Gradle release.
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: MineBlocks-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  # Compiling against the API only proves the symbols exist. This boots a real Paper server with
  # the jar and checks the plugin enables, loads the shipped config, places its blocks and spawns
  # its hologram entities.
  server-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download the plugin jar
        uses: actions/download-artifact@v8
        with:
          name: MineBlocks-${{ github.sha }}
          path: dist

      - name: Boot a Paper server with the plugin
        run: |
          chmod +x .github/scripts/server-test.sh
          .github/scripts/server-test.sh "$PAPER_VERSION" "$(ls dist/*.jar | head -1)"

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-${{ github.sha }}
          path: run/server.log
          if-no-files-found: ignore
