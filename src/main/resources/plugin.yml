name: MineBlocks
version: '${version}'
main: cz.raixo.blocks.MineBlocksPlugin
api-version: '26.2'
description: Server blocks with health, cooldowns, holograms and weighted rewards.
authors: [RAIXOCZ, vesely-jiri]
load: POSTWORLD
softdepend:
  - PlaceholderAPI
  - LuckPerms

permissions:
  mb.admin:
    description: Full access to every MineBlocks command.
    default: op
    children:
      mb.admin.reload: true
      mb.admin.list: true
      mb.admin.teleport: true
      mb.admin.reset: true
      mb.admin.sethealth: true
      mb.admin.edit: true
      mb.admin.create: true
      mb.admin.remove: true
      mb.admin.hologram: true
  mb.admin.reload:
    description: Reload the configuration.
    default: false
  mb.admin.list:
    description: List every block.
    default: false
  mb.admin.teleport:
    description: Teleport to a block.
    default: false
  mb.admin.reset:
    description: Reset a block.
    default: false
  mb.admin.sethealth:
    description: Change the remaining health of a block.
    default: false
  mb.admin.edit:
    description: Open the block editor.
    default: false
  mb.admin.create:
    description: Create a block.
    default: false
  mb.admin.remove:
    description: Delete a block.
    default: false
  mb.admin.hologram:
    description: Edit hologram lines.
    default: false
