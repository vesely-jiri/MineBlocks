name: MineBlocks
version: '${version}'
main: cz.raixo.blocks.MineBlocksPlugin
api-version: '26.2'
description: Server blocks with health, cooldowns, holograms and weighted rewards.
authors: [RAIXOCZ, vesely-jiri]
load: POSTWORLD
softdepend:
  - PlaceholderAPI
  - LuckPerms

# Access to a block is granted by whatever node its `permission` names in config.yml. The shipped
# blocks follow `mineblocks.blocks.<block id>`; those nodes are registered at runtime, because the
# blocks an admin defines are not known here.
permissions:
  mineblocks.admin:
    description: Full access to every MineBlocks command.
    default: op
    children:
      mineblocks.admin.reload: true
      mineblocks.admin.list: true
      mineblocks.admin.teleport: true
      mineblocks.admin.reset: true
      mineblocks.admin.sethealth: true
      mineblocks.admin.edit: true
      mineblocks.admin.create: true
      mineblocks.admin.remove: true
      mineblocks.admin.hologram: true
  mineblocks.admin.reload:
    description: Reload the configuration.
    default: false
  mineblocks.admin.list:
    description: List every block.
    default: false
  mineblocks.admin.teleport:
    description: Teleport to a block.
    default: false
  mineblocks.admin.reset:
    description: Reset a block.
    default: false
  mineblocks.admin.sethealth:
    description: Change the remaining health of a block.
    default: false
  mineblocks.admin.edit:
    description: Open the block editor.
    default: false
  mineblocks.admin.create:
    description: Create a block.
    default: false
  mineblocks.admin.remove:
    description: Delete a block.
    default: false
  mineblocks.admin.hologram:
    description: Edit hologram lines.
    default: false

  # Kept so setups that already granted the old node keep working.
  mb.admin:
    description: Deprecated alias of mineblocks.admin.
    default: false
    children:
      mineblocks.admin: true
