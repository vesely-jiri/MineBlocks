# ---------------------------------------------------------------------------------------------
# MineBlocks
#
# A mine block has health. Every allowed hit takes one health and counts towards the player's
# score. When the health reaches zero the block turns into its cooldown material (bedrock) and
# is unmineable until the cooldown runs out.
#
# The blocks below form the "nexus" ladder: mining a block eventually unlocks the permission for
# the next one. Give your default group `stone.nexus` so everyone can start, the rest is handed
# out by the blocks themselves.
#
#   stone.nexus -> gold.nexus -> color.nexus -> ore.nexus -> mithcoin.nexus
#
# The permission rewards below use LuckPerms commands. Swap them for your permission plugin's
# syntax if you use something else - they are plain console commands.
# ---------------------------------------------------------------------------------------------

lang:
  top:
    nobody: "&8-"
    nobody-breaks: "0"
    not_ranked: "Not ranked"
  timeout:
    message: "%time%"
    max-units: 2
    units:
      hour: "h"
      hours: "h"
      minute: "m"
      minutes: "m"
      second: "s"
      seconds: "s"
  status:
    # %required_tool% resolves to the tool.display of the block, or a generated list of the
    # materials the block accepts.
    timeout: "&c%name% is recharging, back in &f%timeout%"
    afk: "&cYou are AFK."
    no-permission: "&cYou need to unlock this block first."
    invalid-tool: "&cWrong tool. Use: &f%required_tool%"

options:
  afk:
    # Uses the server's own idle timer, no AFK plugin needed.
    enabled: false
    idle-seconds: 300
  notification-type: ACTIONBAR # ACTIONBAR, CHAT or NONE
  block-break-limit: 20 # Minimum milliseconds between two counted hits from one player
  hologram-update-interval: -1 # Ticks between hologram refreshes, -1 refreshes immediately
  offline-rewards: true # Queue rewards for players who logged off before the block was mined out

blocks:

  # -------------------------------------------------------------------------------------------
  # Tier 1 - open to everyone, unlocks the gold nexus
  # -------------------------------------------------------------------------------------------
  stone:
    name: "&7Stone Nexus"
    reward-info: "&7ore every &f5 &7breaks"
    location:
      world: "world"
      x: 0
      y: 100
      z: 0
    type: STONE
    health: 250
    permission: "stone.nexus"
    break-limit: 20
    hologram:
      offset:
        x: 0
        y: 0
        z: 0
      lines:
        - '#ICON: %type%'
        - '#2C74B3&l%name%'
        - '&7Mined: &f%broken%&8/&f%max_health%'
        - '&7Tool: &f%required_tool%'
        - '&7Reward: %reward_info%'
        - ''
        - '#2C74B3&lTOP'
        - '&71. &f%player_1% &8- #2C74B3%player_1_breaks%'
        - '&72. &f%player_2% &8- #2C74B3%player_2_breaks%'
        - '&73. &f%player_3% &8- #2C74B3%player_3_breaks%'
        - '&c%timeout%'
    timeout:
      time: 300 # seconds
      type: BEDROCK
      respawn: "&a[Nexus] &7%name% &7is back online!"
    messages:
      break:
        - "&a[Nexus] &7%name% &7was mined out, back in &f%timeout%&7."
        - "&7Your breaks: &f%breaks%"
    reset:
      inactive:
        time: -1 # Auto-reset after this many seconds without a hit, -1 disables
        message: ""
      onrestart: false
    tool:
      display: "&fany pickaxe"
      types:
        - "default: DENIED"
        - ".*_PICKAXE: ALLOWED"
    rewards:
      every_five:
        type: break
        interval: 5 # Every 5th break by that player
        mode: random # Weighted pick of one entry; use "all" to run every entry
        commands:
          # weight;command - weights are relative, not percentages
          - "60;give %player% cobblestone 16"
          - "30;give %player% coal 4"
          - "10;give %player% iron_ingot 2"
      unlock_gold:
        type: break
        interval: 100
        mode: random
        commands:
          - command: "lp user %player% permission set gold.nexus true"
            chance: 100
            message: "&a[Nexus] &7You unlocked &6gold.nexus&7! The Gold Nexus is now open to you."
            broadcast: false
      top_1:
        type: top
        place: 1
        mode: all
        commands:
          - command: "give %player% diamond 4"
            message: "&a[Nexus] &7You finished &f1st &7on %name%!"

  # -------------------------------------------------------------------------------------------
  # Tier 2 - needs gold.nexus, unlocks the color nexus
  # -------------------------------------------------------------------------------------------
  gold:
    name: "&6Gold Nexus"
    reward-info: "&7gold every &f5 &7breaks"
    location:
      world: "world"
      x: 10
      y: 100
      z: 0
    type: GOLD_BLOCK
    health: 400
    permission: "gold.nexus"
    break-limit: 20
    hologram:
      offset:
        x: 0
        y: 0
        z: 0
      lines:
        - '#ICON: %type%'
        - '#FFAA00&l%name%'
        - '&7Mined: &f%broken%&8/&f%max_health%'
        - '&7Tool: &f%required_tool%'
        - '&7Reward: %reward_info%'
        - ''
        - '#FFAA00&lTOP'
        - '&71. &f%player_1% &8- #FFAA00%player_1_breaks%'
        - '&72. &f%player_2% &8- #FFAA00%player_2_breaks%'
        - '&73. &f%player_3% &8- #FFAA00%player_3_breaks%'
        - '&c%timeout%'
    timeout:
      time: 600
      type: BEDROCK
      respawn: "&a[Nexus] &7%name% &7is back online!"
    messages:
      break:
        - "&a[Nexus] &7%name% &7was mined out, back in &f%timeout%&7."
        - "&7Your breaks: &f%breaks%"
    reset:
      inactive:
        time: -1
        message: ""
      onrestart: false
    tool:
      display: "&firon pickaxe or better"
      types:
        - "default: DENIED"
        - "(IRON|GOLDEN|DIAMOND|NETHERITE)_PICKAXE: ALLOWED"
    rewards:
      every_five:
        type: break
        interval: 5
        mode: random
        commands:
          - "60;give %player% gold_ingot 2"
          - "30;give %player% gold_block 1"
          - "10;give %player% emerald 2"
      unlock_color:
        type: break
        interval: 150
        mode: random
        commands:
          - command: "lp user %player% permission set color.nexus true"
            chance: 100
            message: "&a[Nexus] &7You unlocked &dcolor.nexus&7! The Color Nexus is now open to you."
            broadcast: false
      top_1:
        type: top
        place: 1
        mode: all
        commands:
          - command: "give %player% diamond 8"
            message: "&a[Nexus] &7You finished &f1st &7on %name%!"

  # -------------------------------------------------------------------------------------------
  # Tier 3 - needs color.nexus, unlocks the ore nexus
  # -------------------------------------------------------------------------------------------
  color:
    name: "&dColor Nexus"
    reward-info: "&7dyes and blocks every &f5 &7breaks"
    location:
      world: "world"
      x: 20
      y: 100
      z: 0
    type: PINK_GLAZED_TERRACOTTA
    health: 600
    permission: "color.nexus"
    break-limit: 20
    hologram:
      offset:
        x: 0
        y: 0
        z: 0
      lines:
        - '#ICON: %type%'
        - '<RAINBOW80>%name%</RAINBOW>'
        - '&7Mined: &f%broken%&8/&f%max_health%'
        - '&7Tool: &f%required_tool%'
        - '&7Reward: %reward_info%'
        - ''
        - '#FF55FF&lTOP'
        - '&71. &f%player_1% &8- #FF55FF%player_1_breaks%'
        - '&72. &f%player_2% &8- #FF55FF%player_2_breaks%'
        - '&73. &f%player_3% &8- #FF55FF%player_3_breaks%'
        - '&c%timeout%'
    timeout:
      time: 900
      type: BEDROCK
      respawn: "&a[Nexus] &7%name% &7is back online!"
    messages:
      break:
        - "&a[Nexus] &7%name% &7was mined out, back in &f%timeout%&7."
        - "&7Your breaks: &f%breaks%"
    reset:
      inactive:
        time: -1
        message: ""
      onrestart: false
    tool:
      display: "&fdiamond pickaxe or better"
      types:
        - "default: DENIED"
        - "(DIAMOND|NETHERITE)_PICKAXE: ALLOWED"
    rewards:
      every_five:
        type: break
        interval: 5
        mode: random
        commands:
          - "50;give %player% pink_dye 8"
          - "35;give %player% white_concrete 16"
          - "15;give %player% amethyst_shard 4"
      unlock_ore:
        type: break
        interval: 200
        mode: random
        commands:
          - command: "lp user %player% permission set ore.nexus true"
            chance: 100
            message: "&a[Nexus] &7You unlocked &bore.nexus&7! The Ore Nexus is now open to you."
            broadcast: false
      top_1:
        type: top
        place: 1
        mode: all
        commands:
          - command: "give %player% diamond 16"
            message: "&a[Nexus] &7You finished &f1st &7on %name%!"

  # -------------------------------------------------------------------------------------------
  # Tier 4 - needs ore.nexus, unlocks the mithcoin nexus
  # -------------------------------------------------------------------------------------------
  ore:
    name: "&bOre Nexus"
    reward-info: "&7raw ore every &f5 &7breaks"
    location:
      world: "world"
      x: 30
      y: 100
      z: 0
    type: DEEPSLATE_DIAMOND_ORE
    health: 900
    permission: "ore.nexus"
    break-limit: 20
    hologram:
      offset:
        x: 0
        y: 0
        z: 0
      lines:
        - '#ICON: %type%'
        - '{#00FFD0}%name%{/#0088FF}'
        - '&7Mined: &f%broken%&8/&f%max_health%'
        - '&7Tool: &f%required_tool%'
        - '&7Reward: %reward_info%'
        - ''
        - '#00FFD0&lTOP'
        - '&71. &f%player_1% &8- #00FFD0%player_1_breaks%'
        - '&72. &f%player_2% &8- #00FFD0%player_2_breaks%'
        - '&73. &f%player_3% &8- #00FFD0%player_3_breaks%'
        - '&c%timeout%'
    timeout:
      time: 1800
      type: BEDROCK
      respawn: "&a[Nexus] &7%name% &7is back online!"
    messages:
      break:
        - "&a[Nexus] &7%name% &7was mined out, back in &f%timeout%&7."
        - "&7Your breaks: &f%breaks%"
    reset:
      inactive:
        time: -1
        message: ""
      onrestart: false
    tool:
      display: "&fdiamond pickaxe with Efficiency IV+"
      types:
        - "default: DENIED"
        - "(DIAMOND|NETHERITE)_PICKAXE: ALLOWED"
      enchantments:
        default: DENIED
        efficiency:
          level: 4-5
          type: ALLOWED
    rewards:
      every_five:
        type: break
        interval: 5
        mode: random
        commands:
          - "50;give %player% raw_iron 8"
          - "30;give %player% raw_gold 6"
          - "20;give %player% diamond 2"
      unlock_mithcoin:
        type: break
        interval: 300
        mode: random
        commands:
          - command: "lp user %player% permission set mithcoin.nexus true"
            chance: 100
            message: "&a[Nexus] &7You unlocked &5mithcoin.nexus&7! The final nexus awaits."
            broadcast: true
      top_1:
        type: top
        place: 1
        mode: all
        commands:
          - command: "give %player% netherite_scrap 4"
            message: "&a[Nexus] &7You finished &f1st &7on %name%!"

  # -------------------------------------------------------------------------------------------
  # Tier 5 - needs mithcoin.nexus, the end of the ladder
  # -------------------------------------------------------------------------------------------
  mithcoin:
    name: "&5Mithcoin Nexus"
    reward-info: "&7mithcoins every &f5 &7breaks"
    location:
      world: "world"
      x: 40
      y: 100
      z: 0
    type: CRYING_OBSIDIAN
    health: 1500
    permission: "mithcoin.nexus"
    break-limit: 20
    hologram:
      offset:
        x: 0
        y: 0
        z: 0
      lines:
        - '#ICON: %type%'
        - '{#AA00FF}%name%{/#FF55FF}'
        - '&7Mined: &f%broken%&8/&f%max_health%'
        - '&7Tool: &f%required_tool%'
        - '&7Reward: %reward_info%'
        - ''
        - '#AA00FF&lTOP'
        - '&71. &f%player_1% &8- #AA00FF%player_1_breaks%'
        - '&72. &f%player_2% &8- #AA00FF%player_2_breaks%'
        - '&73. &f%player_3% &8- #AA00FF%player_3_breaks%'
        - '&c%timeout%'
    timeout:
      time: 3600
      type: BEDROCK
      respawn: "&a[Nexus] &7%name% &7is back online!"
    messages:
      break:
        - "&a[Nexus] &7%name% &7was mined out by the server, back in &f%timeout%&7."
        - "&7Your breaks: &f%breaks%"
    reset:
      inactive:
        time: -1
        message: ""
      onrestart: false
    tool:
      display: "&fnetherite pickaxe"
      types:
        - "default: DENIED"
        - "NETHERITE_PICKAXE: ALLOWED"
    rewards:
      every_five:
        type: break
        interval: 5
        mode: random
        commands:
          # Replace with your economy plugin's command, e.g. "eco give %player% 100"
          - "70;give %player% gold_nugget 4"
          - "25;give %player% netherite_scrap 1"
          - "5;give %player% netherite_ingot 1"
      last_hit:
        type: break
        condition: last # The player who lands the final hit
        mode: all
        commands:
          - command: "give %player% netherite_block 1"
            message: "&5[Nexus] &7You landed the final hit on %name%!"
            broadcast: true
      top_1_3:
        type: top
        place: 1-3
        mode: all
        commands:
          - command: "give %player% diamond_block 2"
            message: "&5[Nexus] &7You reached the &ftop 3 &7on %name%!"
